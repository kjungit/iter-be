# 테스트 전용 설정. src/main/resources/application.yaml을 오버라이드한다.
# CI(.github/workflows/ci.yml)의 MySQL 서비스 컨테이너 접속 정보와 값이 맞아야 한다.
# 로컬에서 테스트를 돌리려면 아래 계정/DB로 접근 가능한 MySQL이 로컬에 떠 있어야 한다.
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/iter_test
    username: test
    password: test
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

# 테스트에서만 쓰는 더미 값. 운영 시크릿과 무관하니 실제 서비스 키로 절대 바꾸지 말 것.
jwt:
  issuer: iter-test
  secret-key: h9LoSBbS0hWiMARbSbKj0uuBpb1ChNlxVk0KFAQNyNVkl6EhCljRhgNqUPDAK89lLaBszsr3PHpzAdRqsAc5lg==
  access-token-validity: 30m
  refresh-token-validity: 14d
