spring:
  application:
    name: iter
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

jwt:
  issuer: iter
  audience: iter-api
  secret-key: ${JWT_SECRET_KEY}
  access-token-validity: 15m
  refresh-token-validity: 14d

auth:
  refresh-cookie:
    name: __Secure-iter-refresh
    secure: true
    http-only: true
    same-site: Lax
    path: /api/v1/auth
    max-age: 14d

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    s3:
      bucket: ${S3_BUCKET:iter-local}
      region: ${AWS_REGION:ap-northeast-2}
      public-base-url: ${S3_PUBLIC_BASE_URL:}
      key-prefix: ${S3_KEY_PREFIX:equipment}
      presigned-url-validity: ${S3_PRESIGNED_URL_VALIDITY:5m}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.example.iter: debug
