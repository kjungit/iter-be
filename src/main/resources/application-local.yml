spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/iter?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:local-kakao-client-id}
            client-secret: ${KAKAO_CLIENT_SECRET:local-kakao-client-secret}

auth:
  refresh-cookie:
    name: iter-refresh
    secure: false

app:
  storage:
    s3:
      bucket: iter-nbe1113-team04-equipment
      region: ap-northeast-2
      public-base-url: https://iter-nbe1113-team04-equipment.s3.ap-northeast-2.amazonaws.com
      key-prefix: equipment
      presigned-url-validity: 5m
