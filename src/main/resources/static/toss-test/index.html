<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>토스 결제 테스트</title>
  <script src="https://js.tosspayments.com/v1/payment"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #1a1a1a; }
    h1 { font-size: 20px; }
    p.hint { color: #666; font-size: 14px; }
    label { display: block; margin-top: 16px; font-weight: 600; font-size: 14px; }
    textarea, input { width: 100%; box-sizing: border-box; padding: 8px; margin-top: 4px; font-family: inherit; font-size: 14px; }
    textarea { height: 70px; resize: vertical; }
    button { margin-top: 20px; padding: 10px 16px; font-size: 15px; cursor: pointer; }
    pre { margin-top: 20px; background: #f5f5f5; padding: 12px; white-space: pre-wrap; word-break: break-all; border-radius: 4px; font-size: 13px; }
  </style>
</head>
<body>
  <h1>토스 결제 테스트</h1>
  <p class="hint">
    <a href="/swagger-ui.html" target="_blank">Swagger UI</a>에서 로그인해 발급받은 accessToken을 붙여넣고,
    PENDING 상태(결제 전)인 rentalId를 입력한 뒤 버튼을 누르면 토스 결제창이 열립니다.
  </p>

  <label for="token">Access Token</label>
  <textarea id="token" placeholder="eyJhbGciOi..."></textarea>

  <label for="rentalId">Rental ID</label>
  <input id="rentalId" type="number" placeholder="10" />

  <button id="payBtn">결제 준비 후 결제창 열기</button>

  <pre id="log">여기에 요청/응답 로그가 표시됩니다.</pre>

  <script>
    document.getElementById('payBtn').addEventListener('click', async () => {
      const token = document.getElementById('token').value.trim();
      const rentalId = document.getElementById('rentalId').value.trim();
      const log = document.getElementById('log');

      if (!token || !rentalId) {
        alert('accessToken과 rentalId를 모두 입력하세요.');
        return;
      }

      try {
        const res = await fetch(`/api/v1/rentals/${rentalId}/payment/ready`, {
          method: 'POST',
          headers: { Authorization: `Bearer ${token}` },
        });
        const data = await res.json();
        log.textContent = JSON.stringify(data, null, 2);

        if (!res.ok) return;

        // 토스 결제창은 전체 페이지 이동(리다이렉트)이라 여기서 sessionStorage에 남겨둬야
        // successUrl로 돌아왔을 때 confirm 호출에 다시 쓸 수 있다.
        sessionStorage.setItem('toss-test-token', token);
        sessionStorage.setItem('toss-test-rentalId', rentalId);

        const tossPayments = TossPayments(data.clientKey);
        tossPayments.requestPayment('카드', {
          amount: data.amount,
          orderId: data.orderId,
          orderName: data.orderName,
          customerName: data.customerKey,
          successUrl: `${window.location.origin}/toss-test/success.html`,
          failUrl: `${window.location.origin}/toss-test/fail.html`,
        });
      } catch (e) {
        log.textContent = String(e);
      }
    });
  </script>
</body>
</html>
