<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>토스 결제 승인 처리</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #1a1a1a; }
    pre { margin-top: 20px; background: #f5f5f5; padding: 12px; white-space: pre-wrap; word-break: break-all; border-radius: 4px; font-size: 13px; }
    a { display: inline-block; margin-top: 16px; }
  </style>
</head>
<body>
  <h1>결제 승인 처리 중...</h1>
  <pre id="log">처리 중...</pre>
  <a href="/toss-test/index.html">← 테스트 페이지로 돌아가기</a>

  <script>
    (async () => {
      const log = document.getElementById('log');
      const params = new URLSearchParams(window.location.search);
      const token = sessionStorage.getItem('toss-test-token');
      const rentalId = sessionStorage.getItem('toss-test-rentalId');

      if (!token || !rentalId) {
        log.textContent = 'sessionStorage에 토큰/rentalId가 없습니다. index.html에서 다시 시도하세요.';
        return;
      }

      const body = {
        paymentKey: params.get('paymentKey'),
        orderId: params.get('orderId'),
        amount: Number(params.get('amount')),
      };

      try {
        const res = await fetch(`/api/v1/rentals/${rentalId}/payment/confirm`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${token}`,
          },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        log.textContent = (res.ok ? '결제 완료!\n\n' : '승인 실패\n\n') + JSON.stringify(data, null, 2);
      } catch (e) {
        log.textContent = String(e);
      }
    })();
  </script>
</body>
</html>
